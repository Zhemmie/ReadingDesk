<!DOCTYPE html>
<html lang="en" data-theme="library">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>The Reading Desk</title>
<meta name="description" content="A personal reading list and tracker.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-library.css">
<link rel="stylesheet" href="css/theme-cyberpunk.css">
</head>
<body>
<div class="modeflash" id="modeflash" aria-hidden="true"></div>
<div class="app" id="app">
  <header class="topbar">
    <button class="iconbtn" id="btnSearch" aria-label="Search" aria-expanded="false">&#128269;</button>
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brandText">The Reading Desk</span></h1>
    <button class="iconbtn" id="btnSettingsTop" aria-label="Settings">&#9881;</button>
  </header>

  <div class="searchbar hidden" id="searchbar">
    <input type="search" id="q" placeholder="Search title or author" aria-label="Search titles and authors">
  </div>

  <main class="view" id="view" role="main"></main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button class="tab" data-view="dashboard" role="tab" aria-selected="true"><span class="tab-ic" aria-hidden="true">&#8962;</span><span class="tab-lbl">Home</span></button>
    <button class="tab" data-view="library" role="tab" aria-selected="false"><span class="tab-ic" aria-hidden="true">&#9638;</span><span class="tab-lbl">Library</span></button>
    <button class="tab" data-view="discover" role="tab" aria-selected="false"><span class="tab-ic" aria-hidden="true">&#10022;</span><span class="tab-lbl">Discover</span></button>
    <button class="tab" data-view="stats" role="tab" aria-selected="false"><span class="tab-ic" aria-hidden="true">&#9201;</span><span class="tab-lbl">Stats</span></button>
    <button class="tab" data-view="settings" role="tab" aria-selected="false"><span class="tab-ic" aria-hidden="true">&#9881;</span><span class="tab-lbl">Settings</span></button>
  </nav>

  <button class="fab" id="btnAdd" aria-label="Add a book">+</button>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json" hidden>
<input type="file" id="impfile" accept=".csv,.txt,text/csv,text/plain" hidden>

<script type="module" src="js/app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(reg){reg.update();setInterval(function(){reg.update();},3600000);reg.addEventListener('updatefound',function(){var nw=reg.installing;if(nw){nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller){nw.postMessage('skipWaiting');}});}});}).catch(function(){});var reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloaded)return;reloaded=true;window.location.reload();});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update();});}});});}</script>
</body>
</html>
